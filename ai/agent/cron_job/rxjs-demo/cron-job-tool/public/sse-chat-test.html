<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SSE Chat 测试</title>
    <style>
        * {
          box-sizing: border-box;
        }
  
        body {
          margin: 0;
          min-height: 100vh;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text',
            'Segoe UI', sans-serif;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f5f5f5;
          padding: 24px 16px;
        }
  
        .shell {
          width: 100%;
          max-width: 720px;
        }
  
        h1 {
          font-size: 20px;
          margin: 0 0 12px;
        }
  
        .card {
          background: #ffffff;
          border-radius: 10px;
          border: 1px solid #e5e7eb;
          box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
          padding: 16px 18px 18px;
        }
  
        label {
          display: block;
          font-size: 13px;
          margin-bottom: 6px;
          color: #6b7280;
        }
  
        textarea {
          width: 100%;
          min-height: 80px;
          padding: 8px 10px;
          border-radius: 8px;
          border: 1px solid #d1d5db;
          resize: vertical;
          font-family: inherit;
          font-size: 14px;
          outline: none;
        }
  
        textarea::placeholder {
          color: #9ca3af;
        }
  
        textarea:focus {
          border-color: #3b82f6;
          box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
        }
  
        .controls {
          display: flex;
          align-items: center;
          margin-top: 10px;
          gap: 10px;
        }
  
        button {
          padding: 6px 14px;
          border-radius: 999px;
          border: 1px solid #2563eb;
          background: #3b82f6;
          color: #ffffff;
          font-size: 13px;
          cursor: pointer;
        }
  
        button:disabled {
          opacity: 0.7;
          cursor: not-allowed;
        }
  
        .status {
          font-size: 12px;
          color: #6b7280;
        }
  
        .output {
          margin-top: 16px;
          padding: 10px 10px;
          border-radius: 8px;
          background: #111827;
          color: #e5e7eb;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
            'Liberation Mono', 'Courier New', monospace;
          white-space: pre-wrap;
          max-height: 360px;
          overflow-y: auto;
        }
      </style>
</head>
<body>
    <!-- .shell>.card -->
    <div class="shell">
        <div class="card">
            <h1>AI SSE Chat 测试</h1>
            <label for="query">输入您的问题：</label>
            <textarea id="query" placeholder="请输入您的问题"></textarea>
        </div>
        <div class="controls">
            <button id="sendBtn">开始对话(SSE)</button>
            <div id="status" class="status">状态:待机</div>
        </div>
        <div class="output" id="output"></div>
    </div>
    <script>
      const sendBtn = document.getElementById('sendBtn');
      const queryInput = document.getElementById('query');
      const outputEl = document.getElementById('output');
      const statusEl = document.getElementById('status');

      let es = null;;//全局
//开销比较大 一直等待服务器端数据流到达
      function closeEventSource() {
        if (es) {
          es.close();
          es = null;
        }
        sendBtn.disabled = false;
      }

      sendBtn.addEventListener('click',function() {
        const query = queryInput.value.trim();
        if(!query) {
          alert('请输入问题');
          return ;
        }
        outputEl.innerHTML = '';
        sendBtn.disabled = true ;
        statusEl.textContent = '状态：连接中...';
        const url = `/ai/chat/stream?query=${encodeURIComponent(query)}`//get在传输过程中可能出现丢包的问题
        //进行编码后就绝对正确 URL 编码用于确保传输中的字符（如中文、特殊符号）不会因格式问题导致解析错误，通过将字符转换为百分号编码
        es = new EventSource(url);//天然支持sse路由
        es.onopen = () => {
          statusEl.textContent = '状态：连接成功。流式响应开始...'
        }
        es.onmessage = (event) => {
          outputEl.textContent += event.data;
        }//服务器端推送的数据来了
        es.onerror = (event) => {
          statusEl.textContent = '状态：连接结束或发生错误'
          closeEventSource();//回收对象
        }
      })
      window.addEventListener('beforeunload',closeEventSource)
    </script>
</body>
</html>
<!-- 前端 -->
